# SPDX-License-Identifier: Apache-2.0

name: Rule Executer - Rule processor Automation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Publish Package"]
    types:
      - completed

jobs:
  automate-rule-executer:
    if: |
      github.actor != 'dependabot[bot]' && 
      github.actor != 'dependabot-preview[bot]' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on:
    - ${{ vars.RUNNER_LABEL || 'server-18' }}
    env:
      RULE_NAME: ${{ github.event.repository.name }}
      ORG: ${{ github.repository_owner }}
      SERVER_IP: ${{ vars.SERVER_IP || '10.10.80.18' }}

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (GitHub Packages)
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      # Step 2: Clone Rule Executer Repo and delete package-lock.json file
      - name: Clone Rule Executer Repo
        run: |
          echo "Cloning Rule Executer repo and removing package-lock.json file..."
          git clone https://github.com/tazama-lf/rule-executer -b dev
          cd rule-executer 
          rm -f package-lock.json
          cd ..
          echo "Clone completed."
        env:
          GH_TOKEN: ${{ secrets.TAZAMA_TOKEN }}
      # Step 3: Duplicate Rule Executer Folder to 'rule-executer-$RULE_NAME'
      - name: Duplicate Rule Executer Folder
        run: |
          echo "Duplicating Rule Executer folder to rule-executer-$RULE_NAME..."
          cp -R rule-executer rule-executer-$RULE_NAME
          echo "Rule Executer folder duplicated."

      # Step 4: Update the version in package.json and rule number in Dockerfile
      # - name: Install jq
      #   run: dnf install -y jq
      - name: Normalize rule name
        run: |
          RULE_ID="${RULE_NAME#rule-}"
          echo "RULE_ID=$RULE_ID" >> $GITHUB_ENV
          echo "Normalized RULE_ID=$RULE_ID"

      - name: Modify Rule Executer Dockerfile
        shell: bash
        run: |
          set -euo pipefail

          DOCKERFILE="rule-executer-$RULE_NAME/Dockerfile"

          echo "Patching $DOCKERFILE..."

          # Ensure BuildKit syntax supported by the self-hosted runner.
          sed -i '/^# syntax=docker\/dockerfile:/d' "$DOCKERFILE"
          sed -i '1i# syntax=docker/dockerfile:1.4' "$DOCKERFILE"

          # Replace rule placeholder.
          sed -i "s/placeholder/$RULE_ID/g" "$DOCKERFILE"

          # Fix builder installation.
          sed -i \
            's|RUN --mount=type=secret,id=GH_TOKEN,env=GH_TOKEN npm ci --ignore-scripts|RUN --mount=type=secret,id=GH_TOKEN,required=true GH_TOKEN="$(cat /run/secrets/GH_TOKEN)" npm ci --ignore-scripts|' \
            "$DOCKERFILE"

          # Fix production dependency installation.
          sed -i \
            's|RUN --mount=type=secret,id=GH_TOKEN,env=GH_TOKEN npm ci --omit=dev --ignore-scripts|RUN --mount=type=secret,id=GH_TOKEN,required=true GH_TOKEN="$(cat /run/secrets/GH_TOKEN)" npm ci --omit=dev --ignore-scripts|' \
            "$DOCKERFILE"

          echo "Dockerfile after patch:"
          grep -n -A2 -B2 'npm ci' "$DOCKERFILE"

      - name: Update Rule Dependency Name
        run: |
          echo "Updating rule dependency to @$ORG/$RULE_NAME@latest..."
          cd rule-executer-$RULE_NAME
          npm pkg delete dependencies.rule
          npm pkg set "dependencies.rule=npm:@$ORG/$RULE_NAME@latest"
          echo "Rule dependency updated."

      # Verify Changes in modified files
      - name: Verify Changes
        run: |
          cat rule-executer-$RULE_NAME/package.json
          cat rule-executer-$RULE_NAME/Dockerfile
      
      # Configure npm for GitHub Packages
      - name: Configure npm for GitHub Packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAZAMA_TOKEN }}
        run: |
          set -euo pipefail

          cat > "$HOME/.npmrc" <<EOF
          @tazama-lf:registry=https://npm.pkg.github.com
          @$ORG:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=\${GH_TOKEN}
          always-auth=true
          EOF

          cp "$HOME/.npmrc" "rule-executer-$RULE_NAME/.npmrc"

      - name: Generate package-lock.json for Docker build
        run: |
          export NPM_CONFIG_USERCONFIG="$HOME/.npmrc"
          cd rule-executer-$RULE_NAME
          npm install --ignore-scripts --package-lock-only
        env:
          GH_TOKEN: ${{ secrets.TAZAMA_TOKEN }}

      - name: Install Latest Rule Version
        run: |
          cd rule-executer-$RULE_NAME
          npm pkg delete dependencies.rule
          npm install --save-exact rule@npm:@$ORG/$RULE_NAME@latest --ignore-scripts
          echo "✅ Installed: $(npm list rule --depth=0)"
        env:
          GH_TOKEN: ${{ secrets.TAZAMA_TOKEN }}

      - name: Extract Rule Version
        run: |
          cd rule-executer-$RULE_NAME
          RULE_VERSION=$(node -p "require('./node_modules/rule/package.json').version")
          echo "RULE_VERSION=$RULE_VERSION" >> $GITHUB_ENV
          echo "Detected RULE_VERSION=$RULE_VERSION"

      # Step 6: Build Docker Image and Deploy Container Locally
      - name: Build Docker Image and Deploy Container Locally
        shell: bash
        run: |
          set -euo pipefail

          echo "Building Docker image locally on self-hosted runner..."
          docker build \
            --secret id=GH_TOKEN,env=GH_TOKEN \
            -t "$ORG/$RULE_NAME:latest" \
            "rule-executer-$RULE_NAME"
          echo "Docker Image build complete."
          
          echo "Stopping and removing existing container if running..."
          docker stop $RULE_NAME || true
          docker rm $RULE_NAME || true
          
          echo "Deploying container on local server..."
          docker run -d --name $RULE_NAME \
          -e RULE_NAME=$RULE_ID \
          -e RULE_VERSION=1.0.0 \
          -e RAW_HISTORY_DATABASE=raw_history \
          -e RAW_HISTORY_DATABASE_HOST=$SERVER_IP \
          -e RAW_HISTORY_DATABASE_PORT=15432 \
          -e RAW_HISTORY_DATABASE_USER=postgres \
          -e RAW_HISTORY_DATABASE_PASSWORD=unused \
          -e RAW_HISTORY_DATABASE_CERT_PATH=/usr/local/share/ca-certificates/ca-certificates.crt \
          -e CONFIGURATION_DATABASE=configuration \
          -e CONFIGURATION_DATABASE_HOST=$SERVER_IP \
          -e CONFIGURATION_DATABASE_PORT=15432 \
          -e CONFIGURATION_DATABASE_USER=postgres \
          -e CONFIGURATION_DATABASE_PASSWORD=unused \
          -e CONFIGURATION_DATABASE_CERT_PATH=/usr/local/share/ca-certificates/ca-certificates.crt \
          -e EVENT_HISTORY_DATABASE=event_history \
          -e EVENT_HISTORY_DATABASE_HOST=$SERVER_IP \
          -e EVENT_HISTORY_DATABASE_PORT=15432 \
          -e EVENT_HISTORY_DATABASE_USER=postgres \
          -e EVENT_HISTORY_DATABASE_PASSWORD=unused \
          -e EVENT_HISTORY_DATABASE_CERT_PATH=/usr/local/share/ca-certificates/ca-certificates.crt \
          -e STARTUP_TYPE=nats \
          -e SERVER_URL=$SERVER_IP:14222 \
          -e PRODUCER_STREAM= \
          -e CONSUMER_STREAM= \
          -e STREAM_SUBJECT= \
          -e ACK_POLICY=Explicit \
          -e PRODUCER_STORAGE=File \
          -e PRODUCER_RETENTION_POLICY=Workqueue \
          -e REDIS_HOST="$SERVER_IP" \
          -e REDIS_PORT="6379" \
          -e REDIS_PASSWORD="redis-password" \
          -e REDIS_AUTH= \
          --restart unless-stopped $ORG/$RULE_NAME:latest
          
          echo "Container deployed successfully."
        env:
          GH_TOKEN: ${{ secrets.TAZAMA_TOKEN }}
